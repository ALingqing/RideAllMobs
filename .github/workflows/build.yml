# RideAllMobs - GitHub 构建工作流
# 当推送代码或创建 Pull Request 时自动构建插件

name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 允许手动触发构建
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # 3. 使用 Maven 构建并运行测试
      - name: 使用 Maven 构建
        run: mvn clean package --file pom.xml

      # 4. 上传构建产物 (JAR 文件)
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RideAllMobs
          path: target/RideAllMobs-*.jar
          if-no-files-found: error
